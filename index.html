<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Halı Saha Kadro Yöneticisi</title>
  <style>
    :root {
      --primary: #2e7d32;
      --primary-dark: #1b5e20;
      --bg: #f4f6f8;
      --card-bg: #ffffff;
      --text: #333333;
      --danger: #d32f2f;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 15px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      color: var(--primary);
      margin-bottom: 5px;
    }
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .tab-btn {
      flex: 1;
      padding: 12px;
      background: #e0e0e0;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      color: #555;
    }
    .tab-btn.active {
      background: var(--primary);
      color: white;
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }
    
    /* Form Stilleri */
    .form-box {
      background: white;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      margin-bottom: 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .form-box input, .form-box select {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.95em;
    }
    .form-box input[type="text"] { flex: 2; min-width: 150px; }
    .form-box input[type="number"] { flex: 1; min-width: 80px; }
    .form-box select { flex: 1; min-width: 110px; }
    
    .btn {
      padding: 10px 15px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-danger { background: var(--danger); }
    .btn-block { width: 100%; padding: 14px; font-size: 1.1em; }
    
    /* Oyuncu Yönetim Tablosu */
    .player-table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    .player-table th, .player-table td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid #eee;
    }
    .player-table th { background: #e8f5e9; color: var(--primary-dark); }
    
    /* Seçim Grid */
    .counter {
      text-align: center;
      font-weight: bold;
      margin-bottom: 15px;
      padding: 10px;
      background: #e8f5e9;
      border-radius: 8px;
      color: var(--primary);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 10px;
      margin-bottom: 20px;
    }
    .player-card {
      background: var(--card-bg);
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      padding: 10px;
      display: flex;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }
    .player-card.selected {
      border-color: var(--primary);
      background-color: #e8f5e9;
    }
    .player-card input { margin-right: 8px; }
    
    /* Sonuçlar */
    .results { margin-top: 25px; display: none; }
    .teams-container { display: flex; gap: 15px; flex-wrap: wrap; }
    .team-box {
      flex: 1;
      min-width: 280px;
      background: white;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    .team-box h3 { margin-top: 0; border-bottom: 2px solid #f0f0f0; padding-bottom: 8px; }
    .team-a h3 { color: #d32f2f; }
    .team-b h3 { color: #1976d2; }
    .team-list { list-style: none; padding: 0; margin: 0; }
    .team-list li { padding: 6px 0; border-bottom: 1px solid #f9f9f9; }
    .whatsapp-btn { background-color: #25D366; margin-top: 15px; }
  </style>
</head>
<body>

<div class="container">
  <h1>⚽ Halı Saha Kadro Yöneticisi</h1>
  
  <div class="tabs">
    <button class="tab-btn active" onclick="tabDegistir('kadroTab')">1. Kadro Kur</button>
    <button class="tab-btn" onclick="tabDegistir('yonetimTab')">2. Oyuncu Listesi & Puanlar</button>
  </div>

  <!-- TAB 1: KADRO KURMA -->
  <div id="kadroTab" class="tab-content active">
    <div class="counter" id="counter">Seçilen Oyuncu: 0 / 16</div>
    <div class="grid" id="playerGrid"></div>
    <button id="generateBtn" class="btn btn-block" disabled onclick="kadroOlustur()">Dengeli Kadroları Oluştur</button>

    <div class="results" id="results">
      <div class="teams-container">
        <div class="team-box team-a">
          <h3>🔴 A Takımı (Siyah)</h3>
          <ul class="team-list" id="teamAList"></ul>
        </div>
        <div class="team-box team-b">
          <h3>🔵 B Takımı (Beyaz)</h3>
          <ul class="team-list" id="teamBList"></ul>
        </div>
      </div>
      <button class="btn btn-block whatsapp-btn" onclick="whatsappKopyala()">WhatsApp Metnini Kopyala</button>
    </div>
  </div>

  <!-- TAB 2: OYUNCU YÖNETİMİ -->
  <div id="yonetimTab" class="tab-content">
    <div class="form-box">
      <input type="text" id="newName" placeholder="Oyuncu Adı">
      <input type="number" id="newScore" placeholder="Puan (1-100)" min="1" max="100">
      <select id="newRole">
        <option value="H">Hücum</option>
        <option value="O">Ortasaha</option>
        <option value="D">Defans</option>
        <option value="K">Kaleci</option>
      </select>
      <button class="btn" onclick="oyuncuEkle()">Oyuncu Ekle</button>
    </div>

    <table class="player-table">
      <thead>
        <tr>
          <th>İsim</th>
          <th>Gizli Puan</th>
          <th>Mevki</th>
          <th>İşlem</th>
        </tr>
      </thead>
      <tbody id="playerTableBody"></tbody>
    </table>
  </div>
</div>

<script>
  let oyuncular = JSON.parse(localStorage.getItem("halisaha_oyuncular")) || [];
  let secilenOyuncular = [];
  let sonKadrolar = null;

  document.addEventListener("DOMContentLoaded", () => {
    oyuncuListesiniGuncelle();
    gridiGuncelle();
  });

  function tabDegistir(tabId) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
    
    if(tabId === 'kadroTab') {
      document.querySelectorAll('.tab-btn')[0].classList.add('active');
      gridiGuncelle();
    } else {
      document.querySelectorAll('.tab-btn')[1].classList.add('active');
      oyuncuListesiniGuncelle();
    }
    document.getElementById(tabId).classList.add('active');
  }

  function verileriKaydet() {
    localStorage.setItem("halisaha_oyuncular", JSON.stringify(oyuncular));
  }

  function mevkiFormatla(mevki) {
    switch(mevki) {
      case 'K': return '🧤 Kaleci';
      case 'D': return '🛡️ Defans';
      case 'O': return '⚙️ Ortasaha';
      case 'H': return '⚽ Hücum';
      default: return mevki;
    }
  }

  // OYUNCU YÖNETİM İŞLEMLERİ
  function oyuncuEkle() {
    const name = document.getElementById("newName").value.trim();
    const score = parseInt(document.getElementById("newScore").value);
    const role = document.getElementById("newRole").value;

    if (!name || isNaN(score)) {
      alert("Lütfen geçerli bir isim ve puan girin!");
      return;
    }

    const yeniOyuncu = {
      id: Date.now(),
      isim: name,
      puan: score,
      mevki: role
    };

    oyuncular.push(yeniOyuncu);
    verileriKaydet();
    oyuncuListesiniGuncelle();

    document.getElementById("newName").value = "";
    document.getElementById("newScore").value = "";
  }

  function oyuncuSil(id) {
    if (confirm("Bu oyuncuyu silmek istediğinize emin misiniz?")) {
      oyuncular = oyuncular.filter(p => p.id !== id);
      secilenOyuncular = secilenOyuncular.filter(p => p.id !== id);
      verileriKaydet();
      oyuncuListesiniGuncelle();
    }
  }

  function oyuncuListesiniGuncelle() {
    const tbody = document.getElementById("playerTableBody");
    tbody.innerHTML = "";

    if (oyuncular.length === 0) {
      tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#777;">Henüz eklenmiş oyuncu yok. Yukarıdan ekleyebilirsiniz.</td></tr>`;
      return;
    }

    oyuncular.forEach(p => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td><b>${p.isim}</b></td>
        <td>${p.puan}</td>
        <td>${mevkiFormatla(p.mevki)}</td>
        <td><button class="btn btn-danger" onclick="oyuncuSil(${p.id})">Sil</button></td>
      `;
      tbody.appendChild(tr);
    });
  }

  // KADRO KURMA İŞLEMLERİ
  function gridiGuncelle() {
    const grid = document.getElementById("playerGrid");
    grid.innerHTML = "";

    if (oyuncular.length === 0) {
      grid.innerHTML = `<p style="grid-column: 1/-1; text-align:center; color:#777;">Lütfen önce 'Oyuncu Listesi' sekmesinden oyuncularınızı ekleyin.</p>`;
      return;
    }

    oyuncular.forEach(oyuncu => {
      const isSelected = secilenOyuncular.some(p => p.id === oyuncu.id);
      const card = document.createElement("div");
      card.className = `player-card ${isSelected ? 'selected' : ''}`;
      card.onclick = () => toggleSelect(oyuncu, card);
      card.innerHTML = `
        <input type="checkbox" ${isSelected ? 'checked' : ''} pointer-events="none">
        <div>
          <div style="font-weight:600;">${oyuncu.isim}</div>
          <div style="font-size:0.75em; color:#777;">${mevkiFormatla(oyuncu.mevki)}</div>
        </div>
      `;
      grid.appendChild(card);
    });

    sayaciGuncelle();
  }

  function toggleSelect(oyuncu, card) {
    const checkbox = card.querySelector("input");
    const index = secilenOyuncular.findIndex(p => p.id === oyuncu.id);

    if (index > -1) {
      secilenOyuncular.splice(index, 1);
      card.classList.remove("selected");
      checkbox.checked = false;
    } else {
      if (secilenOyuncular.length >= 16) {
        alert("En fazla 16 kişi seçebilirsiniz!");
        return;
      }
      secilenOyuncular.push(oyuncu);
      card.classList.add("selected");
      checkbox.checked = true;
    }

    sayaciGuncelle();
  }

  function sayaciGuncelle() {
    const counter = document.getElementById("counter");
    const btn = document.getElementById("generateBtn");
    counter.innerText = `Seçilen Oyuncu: ${secilenOyuncular.length} / 16`;
    btn.disabled = secilenOyuncular.length !== 16;
  }

  // Yılan (Snake) Algoritması ile Kadro Kurma
  function kadroOlustur() {
    const sirali = [...secilenOyuncular].sort((a, b) => b.puan - a.puan);

    const takimA = [];
    const takimB = [];
    let puanA = 0;
    let puanB = 0;

    sirali.forEach((oyuncu) => {
      if ((puanA <= puanB && takimA.length < 8) || takimB.length === 8) {
        takimA.push(oyuncu);
        puanA += oyuncu.puan;
      } else {
        takimB.push(oyuncu);
        puanB += oyuncu.puan;
      }
    });

    sonKadrolar = { takimA, takimB };

    document.getElementById("teamAList").innerHTML = takimA.map(p => `<li><b>${p.isim}</b> (${p.mevki})</li>`).join("");
    document.getElementById("teamBList").innerHTML = takimB.map(p => `<li><b>${p.isim}</b> (${p.mevki})</li>`).join("");
    document.getElementById("results").style.display = "block";
    document.getElementById("results").scrollIntoView({ behavior: 'smooth' });
  }

  // WhatsApp Metin Kopyalama
  function whatsappKopyala() {
    if (!sonKadrolar) return;

    let metin = `⚽ *BU HAFTANIN KADROLARI* ⚽\n\n`;
    metin += `🔴 *A TAKIMI (Siyah)*\n`;
    sonKadrolar.takimA.forEach((p, i) => metin += `${i + 1}. ${p.isim} (${p.mevki})\n`);

    metin += `\n🔵 *B TAKIMI (Beyaz)*\n`;
    sonKadrolar.takimB.forEach((p, i) => metin += `${i + 1}. ${p.isim} (${p.mevki})\n`);

    metin += `\n📍 Herkese başarılar!`;

    navigator.clipboard.writeText(metin).then(() => {
      alert("WhatsApp mesajı panoya kopyalandı!");
    });
  }
</script>
</body>
</html>
